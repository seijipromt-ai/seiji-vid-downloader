<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Seiji Vid Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508; --panel: rgba(18, 18, 24, 0.65); --line: rgba(255, 255, 255, 0.08);
    --txt: #ffffff; --dim: #8b949e; --accent: #8B5CF6; --accent-glow: rgba(139, 92, 246, 0.4);
    --cyan: #06B6D4; --font-sans: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: var(--font-sans); min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; position: relative; }
  .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.4; animation: float 12s infinite ease-in-out alternate; }
  .orb-1 { width: 500px; height: 500px; background: #4c1d95; top: -15%; left: -10%; }
  .orb-2 { width: 400px; height: 400px; background: #0891b2; bottom: -15%; right: -10%; animation-delay: -6s; }
  @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(60px, 60px) scale(1.1); } }
  .container { width: 100%; max-width: 680px; padding: 20px; z-index: 1; }
  .card { background: var(--panel); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--line); border-radius: 24px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), var(--cyan), transparent); opacity: 0.7; }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.04em; text-align: center; margin-bottom: 8px; background: linear-gradient(135deg, #fff 0%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p.sub { text-align: center; color: var(--dim); font-size: 14px; margin-bottom: 32px; }
  .input-group { display: flex; gap: 12px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 16px; border: 1px solid var(--line); transition: all 0.3s; }
  .input-group:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
  input[type="text"] { flex: 1; background: transparent; border: none; color: var(--txt); padding: 12px 16px; font-size: 15px; outline: none; }
  button { background: var(--accent); color: #fff; border: none; padding: 0 24px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; min-width: 100px; }
  button:hover:not(:disabled) { background: #a78bfa; transform: translateY(-1px); }
  button:disabled { opacity: 0.7; cursor: not-allowed; }
  .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .results { margin-top: 32px; display: none; animation: slideUp 0.5s forwards; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .video-info { display: flex; gap: 20px; margin-bottom: 24px; background: rgba(255,255,255,0.03); padding: 16px; border-radius: 16px; border: 1px solid var(--line); }
  .thumbnail-container { position: relative; width: 180px; height: 101px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #111; }
  .thumbnail { width: 100%; height: 100%; object-fit: cover; }
  .duration-badge { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-family: var(--font-mono); }
  .meta { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .meta h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .info-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: #ccc; }
  .badge.platform { color: #a78bfa; border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.1); }
  .badge.views { color: #34d399; border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.1); }
  .tech-specs { margin-top: 16px; background: rgba(0,0,0,0.4); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .spec-item { display: flex; flex-direction: column; gap: 2px; }
  .spec-label { font-size: 10px; text-transform: uppercase; color: var(--dim); }
  .spec-value { font-size: 13px; font-family: var(--font-mono); color: #e5e7eb; }
  .download-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
  .btn-dl-wrapper { position: relative; border-radius: 12px; overflow: hidden; }
  .btn-dl { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-decoration: none; font-size: 14px; font-weight: 600; border: 1px solid transparent; background: transparent; width: 100%; cursor: pointer; transition: all 0.2s; z-index: 2; }
  .btn-video { color: #c4b5fd; border-color: rgba(139, 92, 246, 0.4); background: rgba(139, 92, 246, 0.15); }
  .btn-audio { color: #67e8f9; border-color: rgba(6, 182, 212, 0.4); background: rgba(6, 182, 212, 0.15); }
  .progress-container { position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 3; }
  .progress-bar-fill { position: absolute; top: 0; left: 0; bottom: 0; background: rgba(139, 92, 246, 0.4); width: 0%; transition: width 0.2s ease-out; z-index: -1; }
  .progress-text { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: #fff; }
  .error-msg { color: #ef4444; text-align: center; font-size: 13px; margin-top: 20px; padding: 10px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; display: none; }
  @media (max-width: 600px) { .card { padding: 24px; } .video-info { flex-direction: column; } .thumbnail-container { width: 100%; height: 180px; } .download-actions { grid-template-columns: 1fr; } .tech-specs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="container">
  <div class="card">
    <h1>SEIJI VID DOWNLOADER</h1>
    <p class="sub">Extract high-quality videos & audio from any platform.</p>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste YouTube, FB, IG link here..." onkeydown="if(event.key==='Enter') fetchVideo()">
      <button id="fetchBtn" onclick="fetchVideo()">
        <span id="btnText">Fetch</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="results" id="results">
      <div class="video-info">
        <div class="thumbnail-container" id="thumbContainer">
          <img class="thumbnail" id="thumb" src="" alt="Thumbnail">
          <span class="duration-badge" id="vDuration">00:00</span>
        </div>
        <div class="meta">
          <h3 id="vTitle">Video Title</h3>
          <div class="info-grid">
            <span class="badge platform"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg><span id="platText">Platform</span></span>
            <span class="badge views"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg><span id="viewsText">0 views</span></span>
          </div>
        </div>
      </div>

      <div class="tech-specs">
        <div class="spec-item"><span class="spec-label">File Size</span><span class="spec-value" id="specSize">--</span></div>
        <div class="spec-item"><span class="spec-label">Quality</span><span class="spec-value" id="specQuality">--</span></div>
        <div class="spec-item"><span class="spec-label">Video Codec</span><span class="spec-value" id="specVcodec">--</span></div>
        <div class="spec-item"><span class="spec-label">Format</span><span class="spec-value" id="specExt">--</span></div>
      </div>
      
      <div class="download-actions">
        <div class="btn-dl-wrapper">
          <button class="btn-dl btn-video" id="btnDlVideo"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Download Video</button>
          <div class="progress-container" id="progVideo"><div class="progress-bar-fill" id="fillVideo"></div><span class="progress-text" id="textVideo">0%</span></div>
        </div>
        <div class="btn-dl-wrapper">
          <button class="btn-dl btn-audio" id="btnDlAudio"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg> Download Audio</button>
          <div class="progress-container" id="progAudio"><div class="progress-bar-fill" id="fillAudio" style="background: rgba(6, 182, 212, 0.4);"></div><span class="progress-text" id="textAudio">0%</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentUrl = "";

async function fetchVideo() {
  const url = document.getElementById('urlInput').value.trim();
  const btn = document.getElementById('fetchBtn');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('errorMsg');
  const results = document.getElementById('results');

  if (!url) return;

  btn.disabled = true;
  btnText.style.display = 'none';
  spinner.style.display = 'block';
  errorMsg.style.display = 'none';
  results.style.display = 'none';

  try {
    const res = await fetch('/api/extract', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.err);

    const info = data.data;
    currentUrl = url;
    
    document.getElementById('vTitle').textContent = info.title;
    document.getElementById('vDuration').textContent = info.duration;
    document.getElementById('platText').textContent = info.platform;
    document.getElementById('viewsText').textContent = info.views;
    document.getElementById('specSize').textContent = info.size;
    document.getElementById('specQuality').textContent = info.resolution;
    document.getElementById('specVcodec').textContent = info.vcodec;
    document.getElementById('specExt').textContent = info.ext.toUpperCase();
    
    const thumb = document.getElementById('thumb');
    if (info.thumbnail) {
      thumb.src = info.thumbnail;
      document.getElementById('thumbContainer').style.display = 'block';
    } else {
      document.getElementById('thumbContainer').style.display = 'none';
    }

    document.getElementById('btnDlVideo').style.display = info.has_video ? 'flex' : 'none';
    document.getElementById('btnDlAudio').style.display = info.has_audio ? 'flex' : 'none';
    results.style.display = 'block';

  } catch (err) {
    errorMsg.textContent = err.message || "Failed to extract video.";
    errorMsg.style.display = 'block';
  } finally {
    btn.disabled = false;
    btnText.style.display = 'block';
    spinner.style.display = 'none';
  }
}

async function downloadMedia(type, filename, progContainerId, fillId, textId, btnId) {
    if (!currentUrl) return;

    const progContainer = document.getElementById(progContainerId);
    const fill = document.getElementById(fillId);
    const text = document.getElementById(textId);
    const btn = document.getElementById(btnId);

    btn.disabled = true;
    progContainer.style.display = 'flex';
    fill.style.width = '0%';
    text.textContent = 'Processing on server... (Please wait)';

    try {
        const proxyUrl = `/api/download?url=${encodeURIComponent(currentUrl)}&type=${type}`;
        const response = await fetch(proxyUrl);

        if (!response.ok) throw new Error('Download failed');

        // Dahil nag-download pa lang ang server mula sa Facebook, maghihintay tayo ng kaunti
        text.textContent = 'Starting download...';
        
        const contentLength = response.headers.get('content-length');
        const total = parseInt(contentLength, 10);
        let loaded = 0;
        const reader = response.body.getReader();
        const chunks = [];

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.length;

            if (total) {
                const percent = ((loaded / total) * 100).toFixed(1);
                fill.style.width = `${percent}%`;
                text.textContent = `${percent}%`;
            } else {
                text.textContent = `Downloading (${(loaded/1024/1024).toFixed(1)} MB)...`;
            }
        }

        const blob = new Blob(chunks);
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(blobUrl);

        text.textContent = 'Done!';
        setTimeout(() => {
            progContainer.style.display = 'none';
            btn.disabled = false;
        }, 1500);

    } catch (err) {
        alert("Download failed: " + err.message);
        progContainer.style.display = 'none';
        btn.disabled = false;
    }
}

document.getElementById('btnDlVideo').addEventListener('click', () => {
    downloadMedia('video', `seiji_video.mp4`, 'progVideo', 'fillVideo', 'textVideo', 'btnDlVideo');
});

document.getElementById('btnDlAudio').addEventListener('click', () => {
    downloadMedia('audio', `seiji_audio.mp3`, 'progAudio', 'fillAudio', 'textAudio', 'btnDlAudio');
});
</script>
</body>
</html>
